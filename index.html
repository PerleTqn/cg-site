<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site Officiel CG Launcher PC</title>
<meta name="description" content="CG : Communauté Discord privée qui propose des Jeux PC, Logiciels PC & MAC, Films, Séries, Animés et Packs Graphiques gratuitement sans aucune PUB !">
<meta name="theme-color" content="#7c5cff">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
<style>
/* ============ THÈME (modifiable) ============ */
:root{
  --accent:#7c5cff;
  --accent-2:#c06bff;
  --bg:#07070f;
  --bg-2:#0e0e1c;
  --card:rgba(20,20,38,.62);
  --line:rgba(255,255,255,.08);
  --text:#ecebff;
  --muted:#9b9ab8;
  --radius:18px;
  --glow:0 0 0 1px rgba(255,255,255,.06), 0 20px 60px -20px color-mix(in srgb, var(--accent) 55%, transparent);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;overflow-x:hidden}
h1,h2,h3,.brand{line-height:1.15;font-family:"Space Grotesk",Inter,sans-serif;letter-spacing:-.02em}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
body.no-anim *{animation:none!important;transition:none!important}

/* ============ FOND ÉTOILÉ ============ */
#stars{position:fixed;inset:0;z-index:-2;display:block}
.nebula{position:fixed;inset:-20%;z-index:-3;pointer-events:none;
  background:
    radial-gradient(40% 35% at 20% 15%, color-mix(in srgb,var(--accent) 22%,transparent), transparent 70%),
    radial-gradient(35% 30% at 85% 30%, color-mix(in srgb,var(--accent-2) 16%,transparent), transparent 70%),
    radial-gradient(50% 40% at 50% 110%, color-mix(in srgb,var(--accent) 14%,transparent), transparent 70%),
    var(--bg);
  animation:drift 30s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(-3%,2%,0) scale(1.05)}}

/* ============ NAV ============ */
nav{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);background:rgba(7,7,15,.55);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;gap:28px;height:68px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.15rem}
.brand-logo{height:38px;width:auto;display:block;filter:drop-shadow(0 4px 14px color-mix(in srgb,var(--accent) 55%,transparent))}
.logo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-weight:700;font-size:.95rem;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 6px 20px -6px var(--accent)}
.nav-links{display:flex;gap:22px;margin-left:auto;font-size:.93rem;color:var(--muted)}
.nav-links a:hover{color:var(--text)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:12px;font-weight:600;font-size:.95rem;transition:transform .2s, box-shadow .2s, background .2s}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 10px 30px -10px var(--accent)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 14px 36px -10px var(--accent)}
.btn-ghost{background:rgba(255,255,255,.05);border:1px solid var(--line)}
.btn-ghost:hover{background:rgba(255,255,255,.09)}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.icon-btn:hover{background:rgba(255,255,255,.1)}

/* ============ HERO ============ */
.hero{padding:110px 0 80px;display:grid;grid-template-columns:1.1fr .9fr;gap:60px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;font-size:.78rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  background:color-mix(in srgb,var(--accent) 14%,transparent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);color:color-mix(in srgb,var(--accent) 40%,white)}
.dot{width:8px;height:8px;border-radius:50%;background:#3ddc97;box-shadow:0 0 10px #3ddc97;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.4}}
.hero h1{font-size:clamp(2.6rem,5.6vw,4.4rem);line-height:1.04;margin:22px 0 20px}
.grad{background:linear-gradient(120deg,#fff 10%,var(--accent-2) 55%,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.lead{font-size:1.12rem;color:var(--muted);max-width:540px}
.cta{display:flex;gap:12px;margin:34px 0 44px;flex-wrap:wrap}
.stats{display:flex;gap:38px;flex-wrap:wrap}
.stat b{display:block;font-family:"Space Grotesk";font-size:2rem;line-height:1}
.stat span{font-size:.85rem;color:var(--muted)}

/* Faux Discord */
.mock{border-radius:var(--radius);background:var(--card);border:1px solid var(--line);box-shadow:var(--glow);backdrop-filter:blur(10px);overflow:hidden;transform-style:preserve-3d}
.mock-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);font-weight:600}
.mock-head .logo{width:28px;height:28px;font-size:.75rem;border-radius:9px}
.mock-body{padding:14px 10px;max-height:430px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 80%,transparent)}
.cat{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:12px 10px 6px}
.chan{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;color:#c6c5de;font-size:.93rem}
.chan:hover{background:rgba(255,255,255,.05)}
.chan .h{opacity:.45;font-weight:600}
.chan.active{background:color-mix(in srgb,var(--accent) 18%,transparent);color:#fff}
.chan .badge{margin-left:auto;font-size:.7rem;background:var(--accent);padding:1px 7px;border-radius:99px;color:#fff;font-weight:700}

/* ============ SECTIONS ============ */
section{padding:90px 0}
.sec-head{text-align:center;max-width:640px;margin:0 auto 54px}
.sec-head h2{font-size:clamp(2rem,3.6vw,2.8rem);margin:16px 0 12px}
.sec-head p{color:var(--muted)}
.grid{display:grid;gap:20px}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.card{position:relative;padding:26px;border-radius:var(--radius);background:var(--card);border:1px solid var(--line);backdrop-filter:blur(10px);
  transform-style:preserve-3d;transition:transform .25s ease, border-color .25s, box-shadow .25s;will-change:transform}
.card:hover{border-color:color-mix(in srgb,var(--accent) 45%,transparent);box-shadow:var(--glow)}
.card .ic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-size:1.35rem;margin-bottom:18px;
  background:color-mix(in srgb,var(--accent) 16%,transparent);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);transform:translateZ(30px)}
.card h3{font-size:1.15rem;margin-bottom:8px;transform:translateZ(20px)}
.card p{color:var(--muted);font-size:.94rem}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(300px circle at var(--mx,50%) var(--my,50%), rgba(255,255,255,.08), transparent 60%)}
.card:hover::after{opacity:1}

/* App window */
.app-row{display:grid;grid-template-columns:1.25fr .75fr;gap:40px;align-items:center}
.win{border-radius:16px;overflow:hidden;background:#0b0b18;border:1px solid var(--line);box-shadow:var(--glow)}
.win-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#0f0f20;border-bottom:1px solid var(--line);font-size:.75rem;color:var(--muted);font-weight:600;letter-spacing:.06em}
.win-bar i{width:10px;height:10px;border-radius:50%;background:#2a2a40;display:inline-block}
.win-bar .t{margin:0 auto}
.win-tabs{display:flex;gap:6px;padding:12px 14px;border-bottom:1px solid var(--line);overflow:hidden}
.win-tabs span{font-size:.76rem;padding:6px 12px;border-radius:8px;background:rgba(255,255,255,.04);color:var(--muted);white-space:nowrap}
.win-tabs span.on{background:var(--accent);color:#fff}
.win-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:16px}
.tile{aspect-ratio:3/4;border-radius:10px;position:relative;overflow:hidden;border:1px solid var(--line)}
.tile::after{content:"";position:absolute;inset:auto 8px 8px 8px;height:8px;border-radius:4px;background:rgba(255,255,255,.18)}
.win-toast{margin:0 16px 16px;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:.85rem}
.win-toast b{display:block;font-size:.88rem}
.win-toast small{color:var(--muted)}
.feat-list{display:grid;gap:14px;margin-top:26px}
.feat-list li{list-style:none;display:flex;gap:12px;color:var(--muted)}
.feat-list li::before{content:"✦";color:var(--accent-2)}
.feat-list b{color:var(--text);font-weight:600}

/* Étapes */
.step{counter-increment:s}
.step .n::before{content:counter(s,decimal-leading-zero)}
.step .n{font-family:"Space Grotesk";font-size:2.4rem;font-weight:700;color:transparent;-webkit-text-stroke:1px color-mix(in srgb,var(--accent) 70%,white);display:block;margin-bottom:10px}
.steps{counter-reset:s}

/* Avis */
.rating{display:flex;align-items:center;justify-content:center;gap:30px;flex-wrap:wrap}
.big-note{font-family:"Space Grotesk";font-size:4.6rem;font-weight:700;line-height:1}
.dlbox{padding-left:30px;border-left:1px solid var(--line);text-align:center}
.big-dl{font-family:"Space Grotesk";font-size:3rem;font-weight:700;line-height:1;margin-bottom:6px}
@media(max-width:600px){.dlbox{padding-left:0;border-left:0}}
.starsline{font-size:1.6rem;letter-spacing:4px;color:#ffc94d;text-shadow:0 0 18px rgba(255,201,77,.45)}

/* CTA final */
.final{text-align:center;padding:60px 30px;border-radius:28px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 30%,#0c0c1a),color-mix(in srgb,var(--accent-2) 22%,#0c0c1a));border:1px solid var(--line)}
.final h2{font-size:clamp(1.9rem,3.4vw,2.6rem);margin-bottom:12px}
.final p{color:#d8d6f3;margin-bottom:28px}

footer{padding:40px 0 50px;border-top:1px solid var(--line);color:var(--muted);font-size:.88rem}
footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.sig{font-family:"Space Grotesk";letter-spacing:.14em;color:var(--text)}

/* Inclinaison 3D */
.tilt{transition:transform .5s cubic-bezier(.2,.8,.2,1), border-color .25s, box-shadow .25s}
.tilt.tilting{transition:transform .08s linear, border-color .25s, box-shadow .25s}

/* Révélation au scroll */
.reveal{opacity:0;transform:translateY(30px);transition:opacity .8s ease, transform .8s ease}
.reveal.in{opacity:1;transform:none}


/* ============ DÉFILEMENT DES MEMBRES ============ */
.marquee{max-width:1100px;margin:0 auto;display:grid;gap:18px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent);overflow:hidden;padding:6px 0}
.mrow{display:flex;gap:18px;width:max-content;animation:scrollL var(--dur,60s) linear infinite}
.mrow.rev{animation-name:scrollR}
@keyframes scrollL{to{transform:translateX(-50%)}}
@keyframes scrollR{from{transform:translateX(-50%)}to{transform:none}}
.mcard{display:flex;align-items:center;gap:16px;min-width:260px;padding:18px 22px;border-radius:16px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(8px);transition:border-color .25s, transform .25s}
.mcard:hover{border-color:color-mix(in srgb,var(--accent) 50%,transparent);transform:translateY(-3px)}
.mav{position:relative;flex:none;width:52px;height:52px}
.mav img,.mav .ph{width:52px;height:52px;border-radius:14px;object-fit:cover;display:grid;place-items:center;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent-2))}
.mav i{position:absolute;right:-3px;bottom:-3px;width:15px;height:15px;border-radius:50%;border:3px solid #12121f;background:#3ddc97}
.mav i.idle{background:#f0b232}.mav i.dnd{background:#f23f43}
.mcard b{display:block;font-weight:600;max-width:170px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard small{color:var(--muted);font-size:.82rem;display:block;max-width:170px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.members-empty{text-align:center;color:var(--muted);font-size:.93rem}

/* ============ PANNEAU PERSONNALISER ============ */
.panel{position:fixed;top:80px;right:20px;width:300px;z-index:60;padding:22px;border-radius:var(--radius);background:rgba(14,14,28,.92);backdrop-filter:blur(18px);border:1px solid var(--line);box-shadow:0 30px 80px -20px #000;
  transform:translateX(130%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.panel.open{transform:none}
.panel h4{font-family:"Space Grotesk";font-size:1.05rem;margin-bottom:4px}
.panel .lbl{font-size:.68rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:9px;border:2px solid transparent}
.sw.on{border-color:#fff}
.row{display:flex;align-items:center;justify-content:space-between;font-size:.9rem;margin:8px 0}
input[type=range]{width:130px;accent-color:var(--accent)}
.toggle{width:40px;height:22px;border-radius:99px;background:#2a2a40;position:relative;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle.on{background:var(--accent)}
.toggle.on::after{transform:translateX(18px)}

/* ============ MODALE TURNSTILE ============ */
.modal{position:fixed;inset:0;z-index:80;display:none;place-items:center;background:rgba(3,3,10,.7);backdrop-filter:blur(6px)}
.modal.open{display:grid}
.modal-box{width:min(420px,92vw);padding:30px;border-radius:22px;background:#10101f;border:1px solid var(--line);text-align:center;box-shadow:var(--glow)}
.modal-box h3{font-size:1.35rem;margin-bottom:6px}
.modal-box p{color:var(--muted);font-size:.93rem;margin-bottom:20px}
#ts-box{display:flex;justify-content:center;min-height:70px}
#ts-msg{font-size:.85rem;color:var(--muted);margin-top:12px;min-height:20px}
#ts-result{display:none;margin-top:8px}
#ts-result .btn{width:100%;justify-content:center}

@media (max-width:900px){
  .hero,.app-row{grid-template-columns:1fr}
  .g3,.g4{grid-template-columns:1fr 1fr}
  .nav-links{display:none}
  .hero{padding-top:60px}
}
@media (max-width:560px){.g3,.g4{grid-template-columns:1fr}.win-grid{grid-template-columns:repeat(3,1fr)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ============ LANGUE ============ */
.lang{position:relative}
.lang-btn{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-weight:600;font-size:.85rem}
.lang-btn:hover{background:rgba(255,255,255,.1)}
.caret{opacity:.6;font-size:.7rem}
.flag{display:inline-flex;width:22px;height:15px;border-radius:3px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.15)}
.flag svg{width:100%;height:100%;display:block}
.lang-menu{position:absolute;right:0;top:48px;min-width:170px;padding:6px;border-radius:14px;background:rgba(14,14,28,.96);border:1px solid var(--line);box-shadow:0 20px 50px -10px #000;backdrop-filter:blur(14px);
  opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .2s, transform .2s}
.lang-menu.open{opacity:1;transform:none;pointer-events:auto}
.lang-menu button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:9px;font-size:.9rem;text-align:left}
.lang-menu button:hover{background:rgba(255,255,255,.06)}
.lang-menu button.on{background:color-mix(in srgb,var(--accent) 20%,transparent)}
/* Logo du serveur + chargement des salons */
.mock-head .logo{overflow:hidden}
.mock-head .logo img{width:100%;height:100%;object-fit:cover}
.skl{display:inline-block;height:10px;border-radius:5px;background:rgba(255,255,255,.08);width:var(--w,60%);animation:pulse 1.6s infinite}
.chan.sk:nth-child(2n) .skl{--w:45%}.chan.sk:nth-child(3n) .skl{--w:70%}
</style>
</head>
<body>
<div class="nebula"></div>
<canvas id="stars"></canvas>

<!-- ============ NAV ============ -->
<nav>
  <div class="wrap">
    <a href="#top" class="brand"><img class="brand-logo" src="logo.png" alt="CG"><span>CG</span></a>
    <div class="nav-links">
      <a href="#serveur" data-i18n="nav.server"></a>
      <a href="#app" data-i18n="nav.app"></a>
      <a href="#comment" data-i18n="nav.how"></a>
      <a href="#avis" data-i18n="nav.reviews"></a>
      <a href="#membres" data-i18n="nav.members"></a>
    </div>
    <button class="icon-btn" id="openPanel" data-i18n-title="panel.title" aria-label="Personnaliser">🎨</button>
    <button class="btn btn-primary" data-gate="discord" data-i18n="nav.join"></button>
    <div class="lang">
      <button class="lang-btn" id="langBtn" aria-haspopup="true"><span class="flag" id="langFlag"></span><span id="langCode">FR</span><span class="caret">▾</span></button>
      <div class="lang-menu" id="langMenu">
        <button data-lang="fr"><span class="flag" data-flag="fr"></span>Français</button>
        <button data-lang="en"><span class="flag" data-flag="en"></span>English</button>
      </div>
    </div>
  </div>
</nav>

<main id="top">
<!-- ============ HERO ============ -->
<div class="wrap hero">
  <div class="reveal">
    <span class="tag"><span class="dot"></span><span id="onlineTag" data-i18n="hero.tag"></span></span>
    <h1><span data-i18n="hero.t1"></span><br><span class="grad" data-i18n="hero.t2"></span></h1>
    <p class="lead" data-i18n="hero.lead"></p>
    <div class="cta">
      <button class="btn btn-primary" data-gate="discord" data-i18n="cta.join"></button>
      <button class="btn btn-ghost" data-gate="download" data-i18n="cta.download"></button>
    </div>
    <div class="stats">
      <div class="stat"><b id="statMembers">—</b><span data-i18n="stat.members"></span></div>
      <div class="stat"><b id="statOnline">—</b><span data-i18n="stat.online"></span></div>
      <div class="stat"><b id="statNote">—</b><span data-i18n="stat.note"></span></div>
      <div class="stat"><b id="statDl">—</b><span data-i18n="stat.dl"></span></div>
    </div>
  </div>

  <div class="mock tilt reveal">
    <div class="mock-head"><span class="logo" id="guildIcon">CG</span><span id="guildName">Serveur CG</span><span style="margin-left:auto;color:var(--muted);font-size:.8rem">⌄</span></div>
    <div class="mock-body">
      <div class="cat" id="catName">✦ CG</div>
      <div id="chanList"></div>
    </div>
  </div>
</div>

<!-- ============ SERVEUR ============ -->
<section id="serveur">
  <div class="wrap">
    <div class="sec-head reveal">
      <span class="tag" data-i18n="srv.tag"></span>
      <h2 data-i18n="srv.title"></h2>
      <p data-i18n="srv.sub"></p>
    </div>
    <div class="grid g3">
      <div class="card tilt reveal"><div class="ic">🎮</div><h3 data-i18n="srv.c1t"></h3><p data-i18n="srv.c1"></p></div>
      <div class="card tilt reveal"><div class="ic">📝</div><h3 data-i18n="srv.c2t"></h3><p data-i18n="srv.c2"></p></div>
      <div class="card tilt reveal"><div class="ic">🎁</div><h3 data-i18n="srv.c3t"></h3><p data-i18n="srv.c3"></p></div>
      <div class="card tilt reveal"><div class="ic">🛡️</div><h3 data-i18n="srv.c4t"></h3><p data-i18n="srv.c4"></p></div>
      <div class="card tilt reveal"><div class="ic">⭐</div><h3 data-i18n="srv.c5t"></h3><p data-i18n="srv.c5"></p></div>
      <div class="card tilt reveal"><div class="ic">🤝</div><h3 data-i18n="srv.c6t"></h3><p data-i18n="srv.c6"></p></div>
    </div>
  </div>
</section>

<!-- ============ APP ============ -->
<section id="app">
  <div class="wrap app-row">

const FLAGS = {
  fr:'<svg viewBox="0 0 3 2"><rect width="1" height="2" fill="#0055A4"/><rect x="1" width="1" height="2" fill="#fff"/><rect x="2" width="1" height="2" fill="#EF4135"/></svg>',
  en:'<svg viewBox="0 0 19 10"><rect width="19" height="10" fill="#B22234"/><g fill="#fff"><rect y="0.77" width="19" height="0.77"/><rect y="2.31" width="19" height="0.77"/><rect y="3.85" width="19" height="0.77"/><rect y="5.38" width="19" height="0.77"/><rect y="6.92" width="19" height="0.77"/><rect y="8.46" width="19" height="0.77"/></g><rect width="7.6" height="5.38" fill="#3C3B6E"/></svg>'
};
let LANG = "fr";
try{ LANG = localStorage.getItem("cg-lang") || "fr" }catch(e){}
const t = (k, n) => (I18N[LANG][k] ?? I18N.fr[k] ?? k).replace("{n}", n);
const nf = n => new Intl.NumberFormat(LANG === "fr" ? "fr-FR" : "en-US", {notation:"compact", maximumFractionDigits:1}).format(n);

function applyLang(){
  document.documentElement.lang = LANG;
  document.title = t("title");
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-html]").forEach(el => el.innerHTML = t(el.dataset.i18nHtml));
  document.querySelectorAll("[data-i18n-title]").forEach(el => el.title = t(el.dataset.i18nTitle));
  langFlag.innerHTML = FLAGS[LANG]; langCode.textContent = LANG.toUpperCase();
  document.querySelectorAll("[data-lang]").forEach(b => b.classList.toggle("on", b.dataset.lang === LANG));
  renderData(); renderMembers(true);
  if(widgetId !== null && window.turnstile){ turnstile.remove(widgetId); widgetId = null }
}
document.querySelectorAll("[data-flag]").forEach(s => s.innerHTML = FLAGS[s.dataset.flag]);
langBtn.onclick = e => { e.stopPropagation(); langMenu.classList.toggle("open") };
document.addEventListener("click", () => langMenu.classList.remove("open"));
document.querySelectorAll("[data-lang]").forEach(b => b.onclick = () => {
  LANG = b.dataset.lang; try{ localStorage.setItem("cg-lang", LANG) }catch(e){}
  langMenu.classList.remove("open"); applyLang();
});

/* ============ APPARITION AU SCROLL ============ */
const io = new IntersectionObserver(es => es.forEach(e => {
  if(!e.isIntersecting) return;
  const el = e.target; el.classList.add("in"); io.unobserve(el);
  setTimeout(() => { el.classList.remove("reveal","in"); el.style.transitionDelay = "" }, 1100);
}), {threshold:.12});
document.querySelectorAll(".reveal").forEach((el,i) => { el.style.transitionDelay = (i%3)*90+"ms"; io.observe(el) });

/* ============ FAUSSES JAQUETTES (aperçu app) ============ */
const tiles = document.getElementById("tiles");
for(let i=0;i<8;i++){
  const d = document.createElement("div"); d.className = "tile";
  const h = (i*47 + 250) % 360;
  d.style.background = `linear-gradient(160deg, hsl(${h} 70% 45%), hsl(${(h+50)%360} 60% 18%))`;
  tiles.appendChild(d);
}

/* ============ DONNÉES DU SERVEUR (salons, membres, note) ============ */
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const CH_ICON = {0:"#", 5:"📢", 2:"🔊", 13:"🎙️", 15:"💬", 16:"🖼️"};
let DATA = null;   // réponse de /api/discord

function renderData(){
  // Salons (catégorie CG)
  const list = DATA && DATA.channels && DATA.channels.length ? DATA.channels : null;
  catName.textContent = "✦ " + (DATA && DATA.category ? DATA.category : "CG");
  chanList.innerHTML = list
    ? list.map((c,i) => `<div class="chan${i===0?" active":""}"><span class="h">${CH_ICON[c.type]||"#"}</span>${esc(c.name)}</div>`).join("")
    : Array.from({length:8}, () => `<div class="chan sk"><span class="h">#</span><span class="skl"></span></div>`).join("");
  if(DATA && DATA.name){
    guildName.textContent = DATA.name;
    if(DATA.icon) guildIcon.innerHTML = `<img src="${esc(DATA.icon)}" alt="">`;
  }
  // Chiffres
  if(DATA && DATA.members != null){
    statMembers.textContent = nf(DATA.members);
    statOnline.textContent  = nf(DATA.online);
    onlineTag.textContent   = t("hero.tagN", nf(DATA.online));
  }
  // Note
  if(DATA && DATA.rating != null){
    const r = DATA.rating;
    statNote.textContent = bigNote.textContent = r.toFixed(1);
    const full = Math.round(r);
    starsLine.textContent = "★".repeat(full) + "☆".repeat(5-full);
  }
}
let DL = null;
function renderDl(){ if(DL!=null) statDl.textContent = bigDl.textContent = nf(DL) }
async function dlCall(path){
  try{
    const r = await fetch(CONFIG.statsUrl + path, {method:"POST", headers:{"Content-Type":"application/json"}, body:"{}"});
    const d = await r.json(); if(typeof d.downloads==="number"){ DL=d.downloads; renderDl() }
  }catch(e){}
}
async function loadData(){
  dlCall("/downloads");
  try{
    const r = await fetch(CONFIG.discordApiUrl, {cache:"no-store"});
    const d = await r.json();
    if(d.ok){ DATA = d; renderData() }
  }catch(e){}
}

/* ============ MEMBRES CONNECTÉS (widget Discord) ============ */
let MEMBERS = [], MEMBERS_KEY = "", PRESENCE = null;
function memberCard(m){
  const av = m.avatar_url ? `<img src="${esc(m.avatar_url)}" alt="" loading="lazy">` : `<span class="ph">${esc((m.username||"?")[0].toUpperCase())}</span>`;
  const st = ["online","idle","dnd"].includes(m.status) ? m.status : "online";
  const sub = m.activity && m.activity.name ? "🎮 " + m.activity.name : t("st." + st);
  return `<div class="mcard"><div class="mav">${av}<i class="${st}"></i></div><div><b>${esc(m.username)}</b><small>${esc(sub)}</small></div></div>`;
}
function renderMembers(force){
  membersSub.textContent = PRESENCE ? t("mem.subN", PRESENCE) : t("mem.sub");
  const key = MEMBERS.map(m => m.username + m.status + (m.activity ? m.activity.name : "")).join("|");
  if(!force && key === MEMBERS_KEY) return;   // rien n'a changé : on ne relance pas le défilement
  MEMBERS_KEY = key;
  const box = document.getElementById("marquee");
  const list = MEMBERS;
  if(!list.length){ box.innerHTML = `<p class="members-empty">${t("mem.empty")}</p>`; return }
  const rows = Math.min(CONFIG.memberRows, Math.max(1, Math.ceil(list.length/4)));
  const per = Math.ceil(list.length/rows);
  box.innerHTML = "";
  for(let r=0;r<rows;r++){
    let part = list.slice(r*per, (r+1)*per);
    if(!part.length) part = list;
    while(part.length < 8) part = part.concat(part);
    const row = document.createElement("div");
    row.className = "mrow" + (r%2 ? " rev" : "");
    row.style.setProperty("--dur", (part.length*5 + r*6) + "s");
    row.innerHTML = part.map(memberCard).join("").repeat(2);
    box.appendChild(row);
  }
}
async function loadMembers(){
  try{
    const r = await fetch(`https://discord.com/api/guilds/${CONFIG.guildId}/widget.json`, {cache:"no-store"});
    if(!r.ok) throw 0;
    const d = await r.json();
    PRESENCE = d.presence_count || null;
    MEMBERS = (d.members||[]).slice().sort((a,b) => a.username.localeCompare(b.username));
  }catch(e){}
  renderMembers(false);
}
/* Ralentit en douceur au survol (sans s'arrêter), puis reprend */
(() => {
  const box = document.getElementById("marquee");
  let target = 1, rate = 1;
  box.addEventListener("mouseenter", () => target = CONFIG.hoverSpeed);
  box.addEventListener("mouseleave", () => target = 1);
  (function loop(){
    requestAnimationFrame(loop);
    if(Math.abs(rate - target) < .005) return;
    rate += (target - rate) * .08;
    box.querySelectorAll(".mrow").forEach(r => r.getAnimations().forEach(a => a.playbackRate = rate));
  })();
})();

year.textContent = new Date().getFullYear();

/* ============ VÉRIFICATION TURNSTILE ============ */
let gateType = null, widgetId = null;
const modal = document.getElementById("modal");
document.querySelectorAll("[data-gate]").forEach(b => b.addEventListener("click", () => openGate(b.dataset.gate)));
closeModal.onclick = () => { modal.classList.remove("open"); if(widgetId!==null && window.turnstile) turnstile.reset(widgetId) };
modal.onclick = e => { if(e.target===modal) closeModal.onclick() };

function openGate(type){
  gateType = type;
  modalTitle.textContent = t(type==="discord" ? "modal.discord" : "modal.download");
  document.getElementById("ts-result").style.display="none"; tsMsg("");
  modal.classList.add("open");
  if(!CONFIG.turnstileSiteKey){
    return verify("none");   // Turnstile pas encore configuré : le serveur donne directement le lien
  }
  const go = () => {
    if(widgetId===null){
      widgetId = turnstile.render("#ts-box", {sitekey:CONFIG.turnstileSiteKey, theme:"dark", language:LANG, callback: verify});
    } else turnstile.reset(widgetId);
  };
  window.turnstile ? go() : (tsMsg(t("modal.loading")), setTimeout(() => openGate(type), 400));
}
function tsMsg(s){ document.getElementById("ts-msg").textContent = s }
async function verify(token){
  tsMsg(t("modal.checking"));
  try{
    const r = await fetch(CONFIG.verifyUrl, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({token, type:gateType})});
    const d = await r.json();
    if(!d.ok) throw new Error(d.error||"refusé");
    showLink(d.url);
    tsMsg(t("modal.ok"));
  }catch(e){
    tsMsg(t("modal.fail"));
    if(widgetId!==null) turnstile.reset(widgetId);
  }
}
function showLink(url){
  const link = document.getElementById("ts-link");
  link.href = url;
  link.textContent = t(gateType==="discord" ? "modal.openDiscord" : "modal.dlNow");
  document.getElementById("ts-result").style.display = "block";
}
// +1 à chaque clic sur « Télécharger maintenant »
document.getElementById("ts-link").addEventListener("click", () => {
  if(gateType==="download"){ if(DL!=null){ DL++; renderDl() } dlCall("/downloads/hit") }
});

/* ============ PANNEAU / ÉTOILES / EFFETS (CG FX) ============ */
const panel = document.getElementById("panel");
openPanel.onclick = () => panel.classList.toggle("open");
CGFX.init({key:"cg-prefs", palettes:CONFIG.palettes, panel:panel, openBtn:openPanel, starsCanvas:document.getElementById("stars"),
  lang:() => LANG, cards:".tilt", depth:"h3,p,.ic", btnClass:"btn btn-ghost",
  hover:"a,button,select,label,summary,[role=button],input[type=range],.tilt,.card,.btn,.icon-btn"});

/* ============ DÉMARRAGE ============ */
applyLang();
loadData(); loadMembers();
setInterval(() => { loadData(); loadMembers() }, CONFIG.refreshEvery);
</script>
